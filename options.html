<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GitLab Review Checker – Einstellungen</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 16px; width: 360px; }
      label { display: block; margin-bottom: 4px; font-weight: 600; }
      input { width: 100%; padding: 6px; box-sizing: border-box; margin-bottom: 8px; }
      #status { margin-top: 8px; font-size: 0.9em; }
      #status.error { color: #b00020; }
      #status.success { color: #1f7a1f; }
    </style>
  </head>
  <body>
    <label for="baseUrl">GitLab-Basis-URL</label>
    <input id="baseUrl" type="url" placeholder="https://gitlab.firma.de" />
    <button id="save">Speichern</button>
    <div id="status"></div>
    <script type="module" src="options.js"></script>
  </body>
</html>
