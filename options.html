<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title id="title"></title>
    <style>
      :root {
        --bg: #eef1f3;
        --surface: #ffffff;
        --border: #d7dee3;
        --ink: #14181c;
        --ink-muted: #5b6670;
        --accent: #0f8b8d;
        --accent-contrast: #ffffff;
        --danger: #c4432b;
        --success: #1e8e5a;
        --shadow: 0 1px 2px rgba(20, 24, 28, 0.04), 0 8px 24px rgba(20, 24, 28, 0.06);
        --font-mono: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10151a;
          --surface: #171e24;
          --border: #2a343c;
          --ink: #e7ecef;
          --ink-muted: #8ca0ac;
          --accent: #37c9c2;
          --accent-contrast: #06201f;
          --danger: #ff7a63;
          --success: #4ade9a;
          --shadow: none;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 48px 20px;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
      }

      main {
        width: 100%;
        max-width: 440px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 6px;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 24px 0;
        letter-spacing: -0.01em;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 24px;
      }

      .field {
        margin-bottom: 18px;
      }

      .field:last-of-type {
        margin-bottom: 0;
      }

      .field label {
        display: block;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin-bottom: 6px;
      }

      input,
      select {
        width: 100%;
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 10px;
      }

      select {
        font-family: var(--font-sans);
        cursor: pointer;
      }

      input:focus-visible,
      select:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button {
        width: 100%;
        margin-top: 20px;
        padding: 10px 16px;
        font-family: var(--font-sans);
        font-size: 14px;
        font-weight: 600;
        color: var(--accent-contrast);
        background: var(--accent);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      button:hover {
        opacity: 0.88;
      }

      button:active {
        opacity: 0.75;
      }

      #status {
        margin-top: 10px;
        font-size: 12.5px;
        min-height: 1.2em;
      }

      #status.error {
        color: var(--danger);
      }

      #status.success {
        color: var(--success);
      }

      .status-line {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--ink-muted);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ink-muted);
        flex-shrink: 0;
      }

      .status-dot.idle {
        background: var(--ink-muted);
      }

      .status-dot.ok {
        background: var(--success);
      }

      .status-dot.watching {
        background: var(--accent);
        animation: pulse 2s ease-in-out infinite;
      }

      .status-dot.error {
        background: var(--danger);
        animation: pulse 1.2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status-dot {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">
        <span>●</span>
        <span>GitLab Review Checker</span>
      </div>
      <h1 id="heading"></h1>
      <div class="card">
        <div class="field">
          <label id="baseUrlLabel" for="baseUrl"></label>
          <input id="baseUrl" type="url" />
        </div>
        <div class="field">
          <label id="languageLabel" for="language"></label>
          <select id="language">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
        </div>
        <button id="save"></button>
        <div id="status"></div>
        <div class="status-line">
          <span id="statusDot" class="status-dot idle"></span>
          <span id="statusText"></span>
        </div>
      </div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
