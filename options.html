<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title id="title"></title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 16px; width: 360px; }
      label { display: block; margin-bottom: 4px; font-weight: 600; }
      input, select { width: 100%; padding: 6px; box-sizing: border-box; margin-bottom: 8px; }
      #status { margin-top: 8px; font-size: 0.9em; }
      #status.error { color: #b00020; }
      #status.success { color: #1f7a1f; }
    </style>
  </head>
  <body>
    <label id="baseUrlLabel" for="baseUrl"></label>
    <input id="baseUrl" type="url" />
    <label id="languageLabel" for="language"></label>
    <select id="language">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
    <button id="save"></button>
    <div id="status"></div>
    <script type="module" src="options.js"></script>
  </body>
</html>
